<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/shaadi/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Shaadi - Find Your Perfect Match</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#C026D3" />
    <meta name="description" content="India's most trusted matrimonial platform to find your life partner" />
    
    <!-- iOS Specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Shaadi" />
    
    <!-- General -->
    <meta name="application-name" content="Shaadi" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/assets/shaadi/manifest.json" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/assets/shaadi/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/shaadi/icons/icon-180x180.png" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/shaadi/icons/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/shaadi/icons/icon-16x16.png" />
    <script type="module" crossorigin src="/assets/shaadi/assets/index-18ZDm8qv.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/shaadi/assets/frappe-ui-BFkBDKMR.js">
    <link rel="stylesheet" crossorigin href="/assets/shaadi/assets/frappe-ui-DBETyv2W.css">
    <link rel="stylesheet" crossorigin href="/assets/shaadi/assets/index-C0iCNy-u.css">
  </head>
  <body>
    <div id="app"></div>
    
    <script>
      window.csrf_token = "{{ csrf_token }}"
      window.site_name = '{{ site_name }}'
      if (!window.frappe) window.frappe = {}
      frappe.boot = {{ boot }}
    </script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('[PWA] Service Worker registered:', registration);
            })
            .catch(registrationError => {
              console.log('[PWA] Service Worker registration failed:', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
