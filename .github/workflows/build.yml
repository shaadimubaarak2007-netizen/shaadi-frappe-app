name: Build Shaadi App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: shaadi_ui/package-lock.json
    
    - name: Install dependencies
      run: |
        cd shaadi_ui
        npm ci
    
    - name: Run tests
      run: |
        cd shaadi_ui
        npm run test:unit || true
    
    - name: Build frontend
      run: |
        cd shaadi_ui
        npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: frontend-build
        path: shaadi_ui/dist/
        retention-days: 7
    
    - name: Upload build artifacts to GitHub Pages
      uses: actions/upload-pages-artifact@v2
      with:
        path: shaadi_ui/dist/

  build-backend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install frappe-bench
    
    - name: Build app package
      run: |
        # Create app package for distribution
        tar -czf shaadi-app.tar.gz \
          shaadi/shaadi/ \
          shaadi/hooks.py \
          shaadi/license.txt \
          shaadi/README.md \
          --exclude='*.pyc' \
          --exclude='__pycache__' \
          --exclude='node_modules' \
          --exclude='Shaadi-Research'
    
    - name: Upload app package
      uses: actions/upload-artifact@v3
      with:
        name: shaadi-app-package
        path: shaadi-app.tar.gz
        retention-days: 7
