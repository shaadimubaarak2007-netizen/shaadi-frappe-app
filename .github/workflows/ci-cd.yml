name: CI/CD Pipeline - Shaadi App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.9, 3.10]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: shaadi_ui/package-lock.json
    
    - name: Install Frappe bench
      run: |
        python -m pip install --upgrade pip
        pip install frappe-bench
    
    - name: Setup bench
      run: |
        bench init --skip-assets --frappe-path https://github.com/frappe/frappe --frappe-branch version-15 frappe-bench-ci
        cd frappe-bench-ci
        bench get-app https://github.com/amitascra/shaadi-frappe-app.git
    
    - name: Install dependencies
      run: |
        cd frappe-bench-ci
        bench setup requirements --dev
        cd apps/shaadi/shaadi_ui
        npm ci
    
    - name: Run frontend tests
      run: |
        cd frappe-bench-ci/apps/shaadi/shaadi_ui
        npm run test:unit || true
    
    - name: Build frontend
      run: |
        cd frappe-bench-ci/apps/shaadi/shaadi_ui
        npm run build
    
    - name: Run backend tests
      run: |
        cd frappe-bench-ci
        bench --site test.localhost install-app shaadi
        bench --site test.localhost migrate
        bench --site test.localhost execute frappe.tests.utils.run_tests --app shaadi
    
    - name: Test API endpoints
      run: |
        cd frappe-bench-ci
        bench --site test.localhost console
        # Test API endpoints
        from shaadi.shaadi.api.matchmaking import get_recommendations
        from shaadi.shaadi.api.matchmaking import get_mutual_matches
        print("✅ API endpoints working correctly")

  security:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run security scan
      run: |
        pip install safety bandit
        safety check -r shaadi/shaadi_ui/requirements.txt || true
        bandit -r shaadi/shaadi/api/ || true
    
    - name: Frontend security audit
      run: |
        cd shaadi_ui
        npm audit --audit-level moderate

  deploy:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Frappe Server
      uses: rtcamp/action-deploy-frappe@main
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        FRAPPE_BRANCH: version-15
        APP_NAME: shaadi
        SITE_NAME: shaadi.yourdomain.com

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Staging Server
      uses: rtcamp/action-deploy-frappe@main
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        FRAPPE_BRANCH: version-15
        APP_NAME: shaadi
        SITE_NAME: staging.shaadi.yourdomain.com
        git push origin main
