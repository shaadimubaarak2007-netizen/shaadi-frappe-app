name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: shaadi_ui/package-lock.json
    
    - name: Install dependencies
      run: |
        cd shaadi_ui
        npm ci
    
    - name: Run tests
      run: |
        cd shaadi_ui
        npm run test:unit
        npm run test:e2e || true
    
    - name: Build frontend
      run: |
        cd shaadi_ui
        npm run build
    
    - name: Security audit
      run: |
        cd shaadi_ui
        npm audit --audit-level moderate
    
    - name: Deploy to production server
      run: |
        echo "🚀 Deploying to production environment..."
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "Timestamp: $(date)"
        
        # Add your actual production deployment commands here
        # Example:
        # rsync -avz --delete dist/ user@prod-server:/var/www/shaadi/
        # ssh user@prod-server 'cd /var/www/shaadi && docker-compose restart'
        # ssh user@prod-server 'systemctl reload nginx'
    
    - name: Health check
      run: |
        echo "🔍 Performing health check..."
        # Add health check commands here
        # curl -f https://shaadi.yourdomain.com/api/health || exit 1
    
    - name: Notify deployment
      run: |
        echo "✅ Production deployment completed successfully!"
        echo "🌐 Production URL: https://shaadi.yourdomain.com"
        echo "📊 Monitoring: https://monitoring.shaadi.yourdomain.com"
