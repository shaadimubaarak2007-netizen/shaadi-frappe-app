name: Auto Merge Dev to Main

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
    
    - name: Check if merge is needed
      id: check-merge
      run: |
        # Check if there are any differences between dev and main
        git fetch origin
        git checkout main
        git merge origin/dev --no-ff --no-commit
        
        if [ -n "$(git status --porcelain)" ]; then
          echo "merge_needed=true" >> $GITHUB_OUTPUT
          echo "Changes found, merge needed"
        else
          echo "merge_needed=false" >> $GITHUB_OUTPUT
          echo "No changes found, merge not needed"
        fi
        git reset --hard HEAD~1
    
    - name: Merge dev to main
      if: steps.check-merge.outputs.merge_needed == 'true'
      run: |
        echo "🔄 Merging dev to main..."
        git checkout main
        git merge origin/dev --no-ff -m "Auto-merge dev to main - $(date '+%Y-%m-%d %H:%M:%S')"
        
        # Get commit info
        DEV_COMMIT=$(git rev-parse origin/dev)
        MAIN_COMMIT=$(git rev-parse HEAD)
        
        echo "Dev commit: $DEV_COMMIT"
        echo "New main commit: $MAIN_COMMIT"
        echo "Merge completed successfully"
    
    - name: Push to main
      if: steps.check-merge.outputs.merge_needed == 'true'
      run: |
        git push origin main
        
        echo "✅ Successfully pushed merge to main"
        echo "🚀 This will trigger production deployment"
    
    - name: Create release tag
      if: steps.check-merge.outputs.merge_needed == 'true'
      run: |
        # Create a tag for the release
        TAG_NAME="release-$(date '+%Y%m%d-%H%M%S')"
        git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
        git push origin "$TAG_NAME"
        
        echo "🏷️ Created release tag: $TAG_NAME"
    
    - name: No merge needed
      if: steps.check-merge.outputs.merge_needed == 'false'
      run: |
        echo "ℹ️ No changes to merge from dev to main"
